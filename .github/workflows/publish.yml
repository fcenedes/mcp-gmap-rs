name: Publish crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tagged crate to crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify version and published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py verify-tag "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
      - name: Require crates.io credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Set CARGO_REGISTRY_TOKEN in the crates-io environment or repository secrets before publishing."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo publish --dry-run --locked
      - run: python3 .github/scripts/release.py audit-package
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
