apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gmap-rs
data:
  MCP_HTTP_LISTEN: "0.0.0.0:3000"
  MCP_HTTP_ALLOWED_HOSTS: "mcp-gmap-rs:3000,mcp-gmap-rs.default.svc.cluster.local:3000,localhost:3000,127.0.0.1:3000"
  GOOGLE_MAPS_LANGUAGE: "en"
  GOOGLE_MAPS_TIMEOUT: "30"
  RUST_LOG: "warn"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gmap-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gmap-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gmap-rs
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-gmap-rs
          # Build/load locally, or replace with an image in your registry.
          image: mcp-gmap-rs:local
          imagePullPolicy: IfNotPresent
          args: ["--no-env-file", "serve", "http"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: mcp-gmap-rs
            - secretRef:
                name: mcp-gmap-rs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gmap-rs
spec:
  selector:
    app.kubernetes.io/name: mcp-gmap-rs
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
